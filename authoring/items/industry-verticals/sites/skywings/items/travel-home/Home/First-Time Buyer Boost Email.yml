        <p><strong>Subject line options</strong><br />
        A: First-time buyer boost for spring 2026<br />
        B: Lower your monthly mortgage payment<br />
        C: New home support at selected Miller developments</p>
        <p><strong>Pre-header</strong><br />
        Spring 2026 savings to help first-time buyers get moving.</p>
        <p><strong>Opening</strong><br />
        You’ve been looking for the right first home — and keeping the monthly payment in reach matters.</p>
        <p><strong>Body</strong><br />
        That’s why Miller Homes is launching First-Time Buyer Boost for Spring 2026, with a mortgage rate buy-down on selected developments to help make buying feel more manageable.</p>
        <p>If you’re considering a move in Scotland, the North West, Yorkshire or the Midlands, this could be the extra support you need to take the next step.</p>
        <p><strong>CTA</strong><br />
        Button: Explore First-Time Buyer Boost<br />
        Link: Insert campaign landing page URL</p>
        <p>Best wishes,<br />The Miller Homes team</p>
