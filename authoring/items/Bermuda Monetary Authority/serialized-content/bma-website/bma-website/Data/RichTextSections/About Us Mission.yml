        <p>The Bermuda Monetary Authority (Authority or BMA) regulates Bermuda's financial services sector.</p>
        <p>The Authority was established by statute in 1969. Its role has evolved over the years to meet changing needs in the financial services sector. Today it supervises, regulates and inspects financial institutions operating in the jurisdiction. It also issues Bermuda's national currency, manages exchange control transactions, assists other authorities with the detection and prevention of financial crime, and advises Government on banking and other financial and monetary matters.</p>
        <p>The Authority develops risk-based financial regulations that it applies to the supervision of Bermuda's banks, trust companies, investment businesses, investment funds, fund administrators, digital asset businesses, money service businesses, corporate service providers and insurance companies. It also regulates the Bermuda Stock Exchange and Bermuda Credit Union.</p>
        <h4>MISSION STATEMENT</h4>
        <p>We contribute to Bermuda's financial stability, protect customers of financial services and protect Bermuda's currency through:</p>
        <ul>
        <li>Maintaining effective and proactive regulatory frameworks through our highly skilled and engaged workforce,</li>
        <li>Delivering efficient operations and sustainable business practices, and</li>
        <li>Supporting responsible innovation locally and in global markets</li>
        </ul>
        <h4>OUR VISION</h4>
        <p>A globally respected and trusted financial services regulator enabling solutions for customer needs.</p>
