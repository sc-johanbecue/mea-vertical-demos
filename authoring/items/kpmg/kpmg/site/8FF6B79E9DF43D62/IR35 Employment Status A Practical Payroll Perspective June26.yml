    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>Join us for a practical and engaging Beyond session, chaired by Anne-Marie Boden, exploring employment status risk, off-payroll working (IR35), and the often-misunderstood concept of contracted-out services.</p>
        <p>Anne-Marie will be joined by Matthew Newbrook (Senior Manager, KPMG UK) and Ben Murphy (Senior Manager, KPMG) for a live, payroll-focused discussion delivered using interactive, realistic workplace scenarios. The session will bring key issues to life and demonstrate how they arise in practice.</p>
        <p>Designed for payroll and HR professionals, the session will examine where risk emerges when contractual wording, working practices, and operational reality do not align. Drawing on the perspectives of different stakeholders, the discussion will highlight how employment status risks are identified, challenged, and managed—focusing on the facts, evidence, and payroll implications that matter most.</p>
        <p>Attendees will leave with a clearer understanding of how employment status issues play out in the real world, where the key pressure points sit for payroll and HR teams, and what to look for when assessing potential off-payroll (IR35) exposure.</p>
