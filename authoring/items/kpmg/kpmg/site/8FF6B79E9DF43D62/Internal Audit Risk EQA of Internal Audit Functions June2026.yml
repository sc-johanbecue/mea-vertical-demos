    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>This session will be focused on External Quality Assessments (EQA) of Internal Audit (IA) Functions and taking place on Wednesday 17 June, 10:00–11:00.</p>
        <p>The Global Institute of Internal Auditors issued its revised Standards in January 2024, with an effective date of 9 January 2025, alongside the introduction of the new Topical Requirements. These updates represent a significant evolution in expectations for some Internal Audit Functions.</p>
        <p>In response to these changes, we have seen a notable increase in demand for EQAs. This session will therefore focus on:<br />- How organisations are responding to the revised Standards, including readiness assessments, peer reviews, and full EQAs; and<br />- Key thematic insights emerging from EQAs we have performed, including the increased emphasis on Internal Audit strategy, board level profile and influence, effective use of tools and technology, and structured career pathways for internal audit professionals.</p>
