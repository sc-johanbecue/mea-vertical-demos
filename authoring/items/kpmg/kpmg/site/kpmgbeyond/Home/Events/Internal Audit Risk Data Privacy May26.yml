      Value: Data breaches remain one of the most costly and damaging risks for organisations in 2026. The Data (Use and Access) Act was approved last year and has gradually become effective.
    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>Data breaches remain one of the most costly and damaging risks for organisations in 2026. The Data (Use and Access) Act was approved last year and has gradually become effective. It has introduced significant changes to the controller’s obligations, raised Privacy and Electronic Communications Regulations (PECR) penalties in line with UK General Data Protection Regulation (GDPR), and changed the rules around data subject rights. There are much widely publicised incidents where data breaches and fraud have disrupted business and organisations have incurred large financial impacts.</p>
        <p>During this session, Anand Shah, Partner, was joined by James Cassidy, Director in Legal Data Protection, and Sandra Hurley, Senior Manager in Employment Solutions, will outline how organisations are responding to employee information data breach risks, from compliance with UK GDPR, the Data Protection Act 2018 (and equivalent local legislation), to the operational processes, control behaviours and human vulnerabilities that drive most incidents.</p>
        <p>If you would like to speak on any of the above with one of our KPMG specialists, please reach out via email (beyond@kpmg.co.uk).</p>
        <p>*Please be aware that the subtitles for this recording have been automatically generated and may contain inaccuracies.*</p>
