    - ID: "ad74afd6-ca80-4eb4-ad01-26ed711d6e7d"
      Hint: Summary
      Value: Global economic shifts and geopolitical events are reshaping markets faster than many organizations can react.
    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>Global economic shifts and geopolitical events are reshaping markets faster than many organizations can react. Business leaders are expected to make critical decisions amid uncertainty, often with incomplete data and limited time.</p>
        <p>KPMG’s Global Economic and Geopolitical Outlook quarterly webcast series brings together KPMG firm Regional Chief Economists, KPMG International’s Global Geopolitics Lead, and other senior advisors to provide business-focused insights. These engaging 60-minute sessions are designed for time-constrained senior leaders.</p>
        <p>The conflict in Iran has created ripple effects across energy, supply chains, and global markets. Executives should assess how these second‑ and third‑order effects impact investment timing, supply chain design, capital allocation, and risk posture — not just in theory, but in day‑to‑day operations.</p>
        <p>In this webcast, you’ll gain insight into:<br />- The global economic and geopolitical shifts most likely to influence near‑term leadership decisions<br />- How these forces can translate into real business implications for supply chains, investment strategies, and market performance<br />- The early signals leaders should monitor to anticipate disruption and act before risks crystallize</p>
