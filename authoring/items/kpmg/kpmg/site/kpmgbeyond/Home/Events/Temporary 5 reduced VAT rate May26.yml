    - ID: "ad74afd6-ca80-4eb4-ad01-26ed711d6e7d"
      Hint: Summary
      Value: This webinar explores the new temporary 5% VAT rate applying to certain hospitality and leisure supplies between 25 June and 1 September 2026.
    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>This webinar explores the new temporary 5% VAT rate applying to certain hospitality and leisure supplies between 25 June and 1 September 2026. It covers the types of qualifying supplies, including children’s meals, admissions to selected attractions, and family-oriented leisure activities as well as key exclusions such as sporting events and pay-per-ride attractions. The session also highlights areas of uncertainty in HMRC’s guidance, the practical implications for businesses, and the steps organisations should be taking now, from assessing system readiness to managing pricing, bookings, and VAT risk.</p>
        <p>If you would like to speak on any of the above with one of our KPMG specialists, please reach out via email (beyond@kpmg.co.uk).</p>
        <p>*Please be aware that the subtitles for this recording have been automatically generated and may contain inaccuracies.*</p>
