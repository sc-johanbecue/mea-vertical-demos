    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>Please register here for our Autumn Board Leadership Centre (BLC) Social Housing webinar on Tuesday 6 October, 3:30 pm to 5:00 pm.</p>
        <p>Topics will include an economics update and an overview of areas of the new Statement of Recommended Practice (SORP) which are most important for board members.</p>
        <p>Harry Mears, KPMG Partner, will host this event. KPMG Directors Gordon Davey and Mark Dawson, as well as Moustafa Ali from KPMG's Macroeconomics Team, will be the speakers during this session.</p>
        <p>Further details will follow in due course.</p>
