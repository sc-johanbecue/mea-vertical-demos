      Value: Government Departments and their Arm’s Length Bodies are among the most complex organisations when it comes to tax and legal compliance.
    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>Government Departments and their Arm’s Length Bodies are among the most complex organisations when it comes to tax and legal compliance. The interaction of both business and non-business activities, ‘normal’ tax rules, and Government-specific tax rules, creates a landscape that requires careful management and up to date knowledge. This webinar provides a focused update for Government Departments and Arm’s Length Bodies on the latest tax and legal developments affecting the sector. The session will highlight key changes, areas of increasing scrutiny and practical considerations for managing compliance across complex organisational structures.</p>
        <p>Our approach for each session has 3 key aims:<br />- Addressing specific topics requested by you.<br />- Providing updates across all areas of tax using HMRC guidance, case law and our experiences<br />- Discussing a number of selected topics where we see the greatest level or scrutiny or uncertainty</p>
        <p>What we’ll cover:<br />- Latest tax developments, including updates to HMRC guidance and recent case law<br />- Treasury reform of VAT rules for Government Bodies<br />- HMRC’s evolving approach to compliance and what it means in practice<br />- National Minimum Wage: key tax and legal considerations<br />- Corporation Tax for Arm’s Length Bodies, including trading status and available exemptions</p>
        <p>Who should attend?<br />Finance, tax, legal and compliance professionals working within Government Departments and ALBs, as well as those responsible for managing tax risk and oversight.</p>
        <p>Submit Your Topics:<br />- Attendees are welcome to suggest additional areas of interest in advance, and we will incorporate them where possible. Please submit any queries to: suzannah.belk@kpmg.co.uk</p>
