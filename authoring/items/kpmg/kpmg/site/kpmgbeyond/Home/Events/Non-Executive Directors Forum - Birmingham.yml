    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>We’re delighted to invite you to our upcoming NED forum at our Birmingham office on 16 June at 9:00 am.</p>
        <p>We’re inviting all aspiring, new and experienced NEDs to an exclusive event, a morning of insights and networking as we explore some of today’s pertinent issues.</p>
        <p>We’ll be delving into the three topics noted below:<br />- Trusted AI: AI is increasingly shaping core business decisions and creates material risks relating to bias, data privacy, regulation and reputation. Boards remain accountable for how AI is governed, and ineffective oversight can expose organisations to legal, ethical and stakeholder trust issues. A trusted AI approach enables boards to balance innovation with control, supporting resilience, compliance and long term value creation.<br />- Board Inclusion Diversity and Equity: Building inclusive and resilient boards through socio-economic diversity. We will discuss practical and proportionate measures for embedding socio-economic insight into governance and appointments—an emerging area that strengthens Board resilience and future-readiness. Through effective challenge and accountability, boards can help embed inclusive practices that align workforce behaviour with the organisation’s values and long term objectives.<br />- Sustainability: Boards can play a key, proactive role in assessing the opportunities and risks which sustainability presents to long term value creation and organisational resilience. These issues influence strategy, regulatory compliance, investor confidence and reputation, and therefore require effective board level oversight and challenge. Through informed scrutiny, boards can help ensure sustainability is embedded in decision making and aligned with the organisation’s long term interests.</p>
