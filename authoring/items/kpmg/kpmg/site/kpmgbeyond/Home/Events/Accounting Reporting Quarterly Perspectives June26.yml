    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>Navigating evolving financial reporting and sustainability requirements.</p>
        <p>Join KPMG’s Accounting Advisory Services (AAS) team for our next live digital update on Wednesday 24 June, 2:30 - 3:30 PM.</p>
        <p>What's on the agenda?<br />- IFRS 18 – the latest from IFRIC discussions, plus practical insights and implementation considerations.<br />- Regulatory round up – the latest IASB and FRC discussions, priority projects and what’s ahead – including IFRS 20 and FRS 102 Revised.<br />- Modernisation of corporate reporting – what has been announced and what changes can we expect?<br />- Sustainability – key trends shaping the future of reporting and assurance.<br />- AI – where is the AI value in accounting and reporting?</p>
        <p>This session qualifies for CPD hours — simply confirm your attendance after the event.</p>
