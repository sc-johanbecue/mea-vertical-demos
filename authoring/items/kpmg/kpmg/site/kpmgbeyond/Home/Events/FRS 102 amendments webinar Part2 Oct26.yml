    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>KPMG’s Accounting Advisory Services team invites you to a two-part webinar series on the amendments to FRS 102, now effective for many UK private companies.</p>
        <p>Across these sessions, we will explore the key accounting and reporting changes, share practical insights from supporting clients through transition, and outline the actions businesses should be taking now.</p>
        <ul><li>Part 1 (7 July) focuses on core accounting, reporting and systems challenges.</li><li>Part 2 (13 October) covers practical considerations, including auditor expectations, tax implications and stakeholder management.</li></ul>
        <p>Please use the link on this page to register for Part 2. To attend Part 1, please use the Register button on the other event page.</p>
        <p>Designed for CFOs, Finance Directors and financial reporting teams implementing the changes.</p>
