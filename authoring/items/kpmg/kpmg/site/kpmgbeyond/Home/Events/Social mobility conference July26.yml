    - ID: "ad74afd6-ca80-4eb4-ad01-26ed711d6e7d"
      Hint: Summary
      Value: Skills shortages are one of the biggest barriers to sustainable growth in the UK. Addressing them requires action — from business, government and education working together.
    - ID: "b6113907-276a-49c5-85e8-119d7066aa80"
      Hint: Body
      Value: |
        <p>Skills shortages are one of the biggest barriers to sustainable growth in the UK. Addressing them requires action — from business, government and education working together.</p>
        <p>This year’s conference marks an evolution in our programme, with a sharper focus on the skills gaps facing the UK economy and the role that business and government must play together in widening access to education, employment and training.</p>
        <p>Join KPMG’s Social Mobility Conference 2026 to explore how organisations can widen access to opportunity, strengthen talent pipelines and embed socio‑economic inclusion at the heart of their growth strategies.</p>
        <p>Broadcast live from our studio, this 90‑minute virtual conference will bring together business leaders, policymakers and social mobility experts for a focused, practical discussion on:<br />- Tackling the UK’s most pressing skills gaps<br />- Expanding access to education, employment and training<br />- The business case for socio‑economic inclusion<br />- What leaders can do now to drive measurable change</p>
        <p>Register now to secure your place and be part of the conversation shaping a more inclusive, skilled workforce.</p>
