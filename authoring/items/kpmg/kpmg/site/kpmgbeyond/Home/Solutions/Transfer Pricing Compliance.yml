      Value: |
        <image mediaid="" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/TP-Compliance/TP_compliance_Header.jpg?rev=8ab01d16c6a24f52a0734dc0f6ed56c5&hash=C1DBF001C5859BB716EE902CEB481689" alt="Transfer Pricing - header imager" />
    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        Combining cutting-edge technology, expert people, and a seamless process to take the risk out of your Transfer Pricing (TP) compliance.<br />
        <p>With recent updates to the UK TP documentation rules, are you confident that your business is fully compliant and prepared for the future? </p> <h2>Here's how we make it easy:  </h2> <ul> <li>Cutting-edge technology and automation to streamline the process, saving you time and resource</li> <li>Expert guidance and tailored advice</li> <li>Flexible delivery models; from fully outsourced to tech-enabled, in-house solutions</li> <li>Proactive risk management</li> </ul> <img alt="--" style="height:100px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/TP-Compliance/line_V2.png?rev=e362fcde88c04939a2dfa27cc1b4ff2d&hash=104F553C8BBF85A13C019974BA052335" /> <h2>Stay ahead of the curve </h2> <p>Recent changes to the Organisation for Economic Co-operation and Development (OECD) rules mean that HMRC will now have broader information requirements and inspection powers regarding TP compliance. Changes to the legislation will ensure that the relevant TP documents can be requested by HMRC outside of an enquiry.</p> <p>Are you certain that your business complies with these new regulations? </p> <h2>An end-to-end solution </h2> <p>Harness advanced automation to simplify and streamline your TP documentation process, set your business apart with the innovative use of our technology. </p> <h2>Tailored to you </h2> <p>Our experts collaborate with your team to deliver a tailored solution that aligns with your objectives and ensures optimal results. </p> <p>We&rsquo;ll begin with a global risk assessment, considering your jurisdictional presence and the relevant TP compliance laws as well as your strategy and budget.  </p> <h2>Flexible delivery models </h2> <p>Choose the option that best suits your business, from fully outsourced to tech-enabled, in-house solutions.</p> <h2>Strategic risk management </h2> <p>Combine technology with proven processes and specialist knowledge to proactively manage your risks with precision and efficiency. </p> <img alt="TP Compliance stats" style="height:600px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/CRT167612A_TP-Compliance---stats.gif?rev=da64a95849cd49f5947f5df009a6a6d7&hash=D3FA3F988EB07517482F0F8B9B63CA1B" />  <p><em><sub>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities.</sub></em></p>
