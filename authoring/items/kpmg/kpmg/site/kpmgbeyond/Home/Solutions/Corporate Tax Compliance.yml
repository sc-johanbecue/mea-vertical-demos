    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000001"
      Hint: BannerImage
      Value: |
        <image mediaid="" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/CT-Compliance/CT-Compliance-main-image.jpg?rev=f135f3a8ba9e492a9ae80cff4a5d494a&hash=69922C03F612C5E5F4ABD5BFCDE56A53" alt="CT Compliance" />
    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        We combine innovative technology with trusted expertise and high-quality client service to drive added value for your business from your corporate tax (CT) compliance process.
        <p>With prices from &pound;5,000 plus VAT, our dedicated team of experienced and technical specialists will produce quality corporate tax returns in line with the latest HMRC requirements, and our advanced technology allows you to streamline the process, manage risk and save time and resource from your team. </p> <h2>A holistic approach</h2> <p>We&rsquo;ll undertake a technical review of your returns, highlighting tax savings and risk mitigation opportunities where possible. We&rsquo;ll communicate key issues and critical judgements through a tax return insights document. </p> <h2>Trusted relationships</h2> At the start of each compliance cycle, we&rsquo;ll discuss your business activity over the return period, as well as any relevant legislative changes. <p>You&rsquo;ll have regular touchpoints with your dedicated team who will deliver valuable insights to help you get the most out of your CT compliance. </p> <img alt="Start freeing up time and resource today; book a free call" style="height:400px; width:1069px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/CT-Compliance/CT-Compliance---banner_V3.png?rev=ad2ac40748bf42a38e9d39b5547246ee&hash=8E60D8913D0CCB200D096ECECF5462C9" />  <h2>Advanced technology </h2> <p>Our machine-learning platform, Tax Connect, is at the heart of our offering, enabling you to share tax-related information, track progress and approve your tax returns in one, centralised location. </p> <h2>Free up time and resource </h2> <p>Using your trial balance as the basis of your tax return, our technology extracts transactional-level information directly from your accounting systems.  </p> <p>We&rsquo;ll minimise the number of queries, focusing on your key risk areas to efficiently analyse tax sensitive accounts. </p> <p>Any questions we ask will be based on the actual data you provide, rather than a generic tax position.   </p> <h2>Reduce the risk of errors and penalties </h2> <p>We&rsquo;ll co-ordinate data extraction and timelines to avoid duplication of effort and to ensure all data is available well in advance of submission. You'll receive clear notifications and deadlines to upload missing data. </p> <h2>Tailored to your needs </h2> <p>We&rsquo;ll take the time to understand your specific needs and challenges, building you a bespoke service to suit your business.  </p> <p>You&rsquo;ll have access to a range of specialists who'll work closely to deliver a cohesive programme. This could include Corporate Interest Restriction (CIR), Research & Development (R&D) claims, capital allowances, transfer pricing (TP) and hybrid mismatch advice.</p> <h2>Future-proof your processes  </h2> <p>We use standard formats based on HMRC taxonomy so you&rsquo;ll be better prepared for Making Tax Digital and other technological developments, ahead of time. </p> <p>You&rsquo;ll also benefit from a higher quality of output due to accurate categorisation of your core data with a clear audit trail between the source data and final return. </p> <p>Our global footprint means we'll support you with your compliance requirements as you expand internationally, and it&rsquo;s easy for us to add additional services such as transfer pricing documentation and Value Added Tax (VAT) compliance to meet your needs.  </p> <p><img alt=" Ask yourself: How efficient is your current compliance process? Do you have a robust audit trail from your source data to the final tax return? Are you considering all risk areas and opportunities? What else would you prioritise if your team had more resource? " style="height:400px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/CT-Compliance/CT-Compliance---Gif_qus.gif?rev=ba8dcdedda1b48929c96881df2da8d9f&hash=0BE9FE804CF0FD1415FA7A498157162A" /></p> <p><em><sub>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities.</sub></em></p>
