    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        Our Domestic VAT Compliance solution is a simple, cost-effective tool providing greater confidence in the accuracy of your VAT return, prior to it being submitted to the UK tax authorities.<br />
        <p>Using advanced technology and data analytics to fully automate the VAT return process, our solution provides high quality compliance advice with prices from &pound;1,750 per VAT return, plus an initial set-up fee of &pound;5,000.  </p> <h2>An end-to-end solution  </h2> <p><strong></strong>Our Domestic VAT Compliance solution is fully automated and compliant with the Making Tax Digital (MTD) for VAT requirements, providing a digital audit trail from data acquisition through to VAT return submission. </p> <h2>User-friendly and easily accessible </h2> <p>You&rsquo;ll have access to a bespoke online dashboard that displays your end-to-end VAT cycle.  </p> <p>You&rsquo;ll be able to monitor the status of your VAT return preparation, analyse your VAT return data in real time, and track historical filings and payments &ndash; all in one place.  </p> <p>Our solution requires no changes to existing systems or input from IT teams and is quick to set-up.  </p> <h2>Safeguarding through automation </h2> <p>When you consider the quantity and complexity of data that feeds into your VAT return, the risk of error is high. Using advanced technology, we&rsquo;ll run a comprehensive suite of automated data integrity checks on each return, so that you can feel more confident in the accuracy of the VAT return prior to submission, reducing the risk of errors and penalties.  </p> <p>You&rsquo;ll also receive automated notifications and reminders to reduce the chance of missed filings or payment deadlines. </p> <h2>In-depth insight and analysis </h2> <p>With greater transparency and insight into the underlying transactional data used to produce the VAT return, you&rsquo;ll gain a better understanding of where errors can occur and how to address them.</p> <h2>Ongoing support from our experts</h2> <p>You&rsquo;ll receive one-to-one support from our team in relation to Government Gateway issues, as well as periodic (monthly, bi-monthly, or quarterly) meetings with a dedicated KPMG client service team to discuss any VAT compliance related issues and updates.  </p> <p>You&rsquo;ll also benefit from direct access to one of the UK&rsquo;s largest indirect tax practices and KPMG&rsquo;s network of indirect tax professionals. When required, we can provide global VAT compliance support though our global delivery centres. </p> <h2>Fees </h2> <p><strong>Per return fee</strong>: prices start from &pound;1,750 (exc. VAT) </p> <p><strong>One off set up fee:</strong> prices start from &pound;5,000 (exc. VAT) which includes:  </p> <ul> <li>Completion of all onboarding checks </li> <li>Reviewing and mapping source data</li> <li>Support with HMRC Digital Gateway registration and set-up if required</li> <li>Running a parallel run of a VAT return to ensure that our compliance process accurately captures all source data</li> <li>Guidance and training for users of the service </li> </ul> <p> </p> <p><img alt="Number of KPMG clients: 150+ , Number of returns submitted per annum: 400+, Number of late filing penalties: Zero " style="height:600px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/VAT-Compliance/VAT-stats.gif?rev=92f3097173244dcea9d405ca891e30c0&hash=9AC7C5174295E6F8E54538CBBF6DECC4" /></p> <p> </p> <p> </p> <p><img alt="Like many businesses, our client heavily relied on Excel worksheets to collate the data used to prepare and file the VAT return. It meant that they were performing limited and basic checks on the data before submitting the VAT return to HMRC. As a wholesale and retail business, the client manages a high volume of transaction data and files monthly VAT returns. The data analytics checks that we run as part of the VAT return preparation process has given the client greater confidence over the accuracy and completeness of the VAT return, and our automated end-to-end process has reduced the amount of time it takes to prepare the VAT return, freeing up valuable resource within the finance team.’ Neil Weedon, Partner, Indirect Tax (Retail & Consumer client) " style="height:850px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/VAT-Compliance/Solution-page-quote-template-3.png?rev=a3eaed24f2404a4f8906b9bf0eb2732d&hash=D83B627E9F4B1CE83E29B6E9747AB7E0" /></p> <p> </p> <p><em><sub><sup>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities</sup></sub></em></p>
