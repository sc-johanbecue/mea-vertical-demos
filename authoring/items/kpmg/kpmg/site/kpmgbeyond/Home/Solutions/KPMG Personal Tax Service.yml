    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        <p>Our personal tax offering is an efficient, accessible and affordable service that provides high-quality, tailored tax advice built around your personal needs.</p>
        <p>Success doesn&rsquo;t happen by accident. Having a goal, careful planning and making confident decisions will have contributed to your achievements. It&rsquo;s time those same principles were applied to your personal tax management. By overlaying leading technology with our tax practice expertise, a knowledgeable personal tax adviser can guide you through a review of your tax affairs, leaving you in control. </p> <h2>The highest calibre advice </h2> <p>Our Personal Tax Service is provided by KPMG&rsquo;s leading private client tax advisors. Relationships are at the heart of our business; you&rsquo;ll have a named contact in the UK who will head-up our relationship with you, backed up by the expertise of our tax practice. When appropriate, we can bring the right people from within the wider KPMG firm to you, at the right time. </p> <h2>Simple and pragmatic </h2> <p>Whether it&rsquo;s advice on significant lifestyle changes such as an international move, an inheritance receipt, or helping your children buy their first home, or you simply want to ensure that your tax affairs are properly managed, KPMG will offer clear advice that's tailored to your individual circumstances.</p> <h2>Efficient, accessible and affordable </h2> <p>Our personal tax service uses technology to help you access the high-quality, personal tax advice you need - at a price you can afford. Our easy-to-use client portal is designed to put you in control, and our prices (which are tailored to your needs) are cost-effective and transparent. </p> <p> <img alt="" style="height:140px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Personal-Tax-Service/Use_titleV2.png?h=140&w=1920&rev=c238f2d0f1514eb9a465adc5f3cabef9&hash=9DEA1D762F5B302A4C809F20B87184F0" />KPMG&rsquo;s dedicated team of tax professionals across the UK can help you with all aspects of business, personal and family tax issues &ndash; offering comprehensive personal tax advisory and compliance services. Now is the time to take professional advice and in doing so, help secure your financial future &ndash; and that of your family &ndash; for years to come.</p> <p><strong>Compliance Services</strong> | From &pound;2,000 +VAT</p> <ul> <li>Personal tax returns</li> <li>Advice on IHT, trust & estate</li> <li>ATED, NRL, and NRCGT</li> </ul> <p><strong>Inheritance Tax</strong> | From &pound;3,500 +VAT</p> <ul> <li>Explain & assess your exposure to IHT</li> <li>Statutory exemptions & reliefs</li> <li>Trust & estate compliance</li> </ul> <p><strong>Property Advice</strong> | From &pound;3,500 +VAT </p> <ul> <li>Buy-to-let & acquisition advice</li> <li>Family property matters</li> <li>Second home acquisition</li> <li>Property disposal advice</li> </ul> <p><strong>Entrepreneurs & OMBs </strong>| Dependent on circumstances </p> <ul> <li>Business exits & share disposal</li> <li>Entrepreneur/investor relief reviews</li> <li>Shareholder structuring</li> </ul> <p><strong>Family Matters </strong>| From &pound;3,500 +VAT </p> <ul> <li>Income Tax, IHT and CGT</li> <li>Asset transfers & separation</li> <li>Tax considerations for prenuptial agreements</li> </ul> <p><strong>Living & Working Overseas</strong> | From &pound;3,500 +VAT</p> <ul> <li>Compliance & reporting obligations</li> <li>Arrivals & departures</li> </ul> <p> </p> <p> </p> <p><img alt="As the UK tax system becomes ever more complex, it’s time to get confident about your tax affairs. Our dedicated team of tax professionals across the UK can help you with all aspects of business, personal and family tax issues. We’ll help you get a complete picture of your tax position and support you in managing it proactively. We give you the tools to understand, plan and grasp the challenges of the tax system to put you in control today and ready for tomorrow.” Nick Pheasey, KPMG UK, Head of Family Office & Private Client " style="height:500px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Personal-Tax-Service/PTS_quote_V3.png?rev=bebd087fff374179afd13e5c0922b64f&hash=743FA2E532D175CA04C416E870BA2469" /></p> <p> </p> <p><sub><sup><em>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities.</em></sup></sub></p>
