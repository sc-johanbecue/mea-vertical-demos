    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        Our Fraud Risk Questionnaire is a free, easily accessible web-based tool which provides a quick overview of how well your organisation is managing its fraud risk. It can be completed within 10 minutes and provides an instant response.
        <p>Under the new Failure to Prevent Fraud Act, introduced in September 2025, it&rsquo;s now your responsibility to demonstrate reasonable fraud prevention procedures across your business.   <br /> <br /> Our questionnaire is a first step on the journey to assessing how robustly you're managing your fraud risk. We can support you in assessing the maturity of your fraud risk strategy, and whether it aligns to the requirements of the Failure to Prevent Fraud legislation.  </p> <h2>Assess your risk</h2> <p>Don't leave your business exposed to vulnerabilities. Quickly and easily understand how effectively your fraud risk management processes are embedded within your organisation, and how well your fraud risk is being managed.  </p> <h2>Identify your weaknesses </h2> <p>From your results, you&rsquo;ll know if there is more you could - and should - be doing to prevent fraud.  </p> <p>If that&rsquo;s the case, we can support you with a more detailed maturity assessment, encompassing the key elements of strategy, governance, risk assessments, training, and monitoring. </p> <p> <img alt="" style="height:500px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Fraud-Risk-Pre-Assessment/Copy-of-Fraud---banner_v4.png?h=500&w=1920&rev=f0233e18e05c4a768f7b192ce127dc3f&hash=F178EC35C6E69468D5291CB42B21F988" /></p> <h2>Take action  </h2> <p> From setting clear strategic directions to implementing effective monitoring techniques, we&rsquo;ll work to ensure that your business is equipped to combat fraud at every level. </p> <h2>Remain compliant </h2> <p>Failure to prevent offences can result in severe penalties, including hefty fines and reputational damage. It's now your responsible to ensure the necessary controls are in place to prevent fraud.  </p> <p>Across our team of accountants, investigators, economists, technology specialists, ex-law enforcement professionals and regulators, we bring together a wealth of forensic skills to support your business in its compliance. </p> <img alt="Total value hits nearly £1 billion of alleged fraud cases reaching UK Crown Courts It’s estimated that up to 5% of business revenues are lost to fraud Over a third (36%) of businesses assess their fraud risk on an ad hoc basis." style="height:600px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Fraud-Risk-Pre-Assessment/Fraud-Risk-QA--statsV4.gif?rev=15c4e049da694ec3b2675be63f3ee745&hash=D80700A079E57AF12628F194D6EA8B51" />  <h2>Did you know? </h2> <ul> <li>Crime statistics suggest that fraud related incidents currently account for almost 40% of all crime committed in the UK</li> <li>The total value of alleged fraud cases reaching UK Crown Courts is almost &pound;1 billion </li> <li>It&rsquo;s estimated that up to 5% of business revenues are lost to fraud</li> <li>Over a third (36%) of businesses assess their fraud risk on an ad hoc basis, and almost one in ten has never carried out a fraud risk assessment. </li> </ul> <div>Start proactively managing your fraud risk today. Complete our short questionnaire to get your free risk score results. </div> <p><em><sub><sup>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities</sup></sub></em></p>
