    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        <p>Cyber Risk Insights (CRI) is a market leading SaaS platform. It takes a scenario-driven approach to help you measure the likelihood and impact of cyber-attacks more accurately on your organisation. </p>
        <h2>Want to understand your weaknesses?</h2> <p>See exactly where your defences are holding firm and where they&rsquo;re leaving you exposed. CRI pinpoints the weakest controls at every stage of the attack path, so you know what matters most. </p> <ul> <li>Prioritise your cyber investments using clear &ldquo;What if&rdquo; scenario planning and attack path modelling. </li> <li>Refresh assessments as often as needed to understand your live risk position.  </li> <li>Track how your defences have improved over time with on-going, repeatable assessments.  </li> </ul> <h2>Need to express risk quantitatively? </h2> <p>CRI brings simplicity and rigour to quantitative cyber risk analysis. No guesswork, just consistent, data‑driven results that give you clarity at a glance.  </p> <ul> <li>Instantly see the average expected loss for every scenario.  </li> <li>Understand risk at both assessment, organisation and aggregate levels &ndash; ideal for managing a portfolio of risks across your enterprise.  </li> </ul> <img alt="CRI Book a Demo" style="height:550px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Cyber-Risk-Insights/Cyber-Risk-Insights-(1)/Cyber-Risk-Insights-(1)/Cyber-Risk-Insights-(2)/Cyber-Risk-Insights-(4)/CRI-Book-a-Demo.png?rev=485e7bf66fb748ea85a4ba4af0bc8b80&hash=9322800EBA8654FBB8EE3E84608F1FA6" />  <h2>Want to speak in a language your stakeholder understands? </h2> <p>CRI turns cyber risk into business language. It&rsquo;s logical and transparent approach helps you communicate clearly with senior stakeholders, demonstrate the business benefits of cyber capabilities and make compelling investment cases. </p> <ul> <li>Get an overview of your planned investments and how they impact your risk position. </li> <li>Demonstrate to senior stakeholders the cost-benefit of your cyber investments. </li> <li>Target investment in the right areas and where it delivers the greatest impact. </li> </ul>   <h2>Optimise your investments </h2> <p>Make every pound count. CRI helps you shape an optimal cyber investment strategy, ensuring you get bang-for-your-buck when it comes to risk reduction. </p> <ul> <li>Input the cost of your improvements to understand the benefit in terms of reduced expected cyber losses. </li> <li>Measure cyber risk against your organisation&rsquo;s risk appetite.  </li> <li>Build your ideal investment strategy through scenario planning and analysis.  </li> <li>Use year-on-year loss modelling to ensure you have the proportionate cyber insurance and capital reserves in the event of an attack. </li> </ul> <p> <br /> <img alt="CRI We've Supported Banner" style="height:400px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Cyber-Risk-Insights/Cyber-Risk-Insights-(1)/Cyber-Risk-Insights-(1)/Cyber-Risk-Insights-(2)/Cyber-Risk-Insights-(4)/CRI-Weve-Supported-Banner.gif?rev=f83e6871475d4d5da0d9cb5b844cae3a&hash=3A891ACB2943D6D62102EFEA5155E457" /></p>    <p> </p>  <img alt="CRI Quote" style="height:500px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Cyber-Risk-Insights/Cyber-Risk-Insights-(1)/Cyber-Risk-Insights-(1)/Cyber-Risk-Insights-(2)/Cyber-Risk-Insights-(4)/CRI-Quote.png?rev=6739600516804664a4254fd5b084fc1c&hash=A7FEDB0B677DA26521340DE4AC94BD4B" /> <p> </p> <p><em><sub>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities</sub></em></p>
