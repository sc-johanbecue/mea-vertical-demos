      Value: |
        <image mediaid="" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/LER/LER-main.jpg?rev=35809aee50b543c0825f998746e656d1&hash=769942BEC7B4C2119B7A10B29397ABA5" alt="Legal Entity Reduction" />
    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        Our Legal Entity Reduction (LER) solution simplifies the complex. Plan and implement your reorganisation projects with ease and gain additional insight into your entity data.
        <p>Not only are surplus and inefficient entities expensive to maintain, but they have the potential to hinder the future growth of your business. Using our market-leading technology platform, our multidisciplinary team will work with you to deliver your LER project from inception to completion.</p> <h2>Agile planning  </h2> <p>Build and reorder legal plans quickly and easily with drag-and-drop functionality.  </p> <h2>Simplified timelines </h2> <p>Our automated timeline tool helps demonstrate the art of the possible with integrated sequencing and timeline planning. </p> <h2>Control legal implementation with speed and ease </h2> <p>The platform's step-plan builder makes it fast and efficient to compile a legal steps paper and supporting work.  </p> <p>With automated dashboards and status reports, easily review and edit plans to identify and control key data points such as duration, participating entities and issue tracking - in real time. </p> <h2>Dynamic structure charts </h2> <p>Use your legal entity data to create dynamic structure charts with the flexibility to surface, filter and highlight key entity characteristics in a clear, visual manner.  </p> <p>Simulate proposed group reorganisations or simplifications at the click of a button.  </p> <h2>A single source of truth  </h2> <p>Our platform will host the data-room, store project documents, provide status updates, and give total oversight of each step of the process, until your final goal is reached.  </p> <p>With your entity data stored together in one place, you&rsquo;ll avoid duplication of documentation and you'll streamline the workload of your advisors.   </p> <h2>No surprises   </h2> <p>We'll work with you to manage costs, agreeing milestones and only actioning when the time is right, helping you to identify any unexpected legal costs or implementation issues early in the process. </p> <h2>Risk management </h2> <p>Success isn't just the reduction of cost through simplification, but also minimising personal liability and risk. We understand the risks and how to reduce them, giving you peace of mind. </p> <h2>An integrated approach </h2> <p>We&rsquo;ll take the lead in managing your project, coordinating the input of our overseas teams to deliver the end result. </p> <p><img alt=""The team is made up primarily of corporate lawyers. They are well staffed and have a range of experience. Their main strength is their legal technology innovation. The platform tool that they have made available to us is a game changer. It is hugely impressive and is able to give an overview of the various steps involved in the reorganisation,” The Legal 500 Ranking, KPMG Law client" style="height:500px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/LER/LER-quote.png?rev=a07fb6d106de4257b098acf99299ce59&hash=41EE40F3257EF861A6ADB58FDE1E2000" /></p> <p><em><sub><sup>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities. <em><sup><sub>KPMG Law is part of KPMG LLP, a multi-disciplinary practice authorised and regulated by the Solicitors Regulation Authority. SRA ID: 615423. For full details of our professional regulation please refer to 'Regulatory information' under 'About' at kpmg.com/uk</sub></sup></em></sup></sub></em></p>
