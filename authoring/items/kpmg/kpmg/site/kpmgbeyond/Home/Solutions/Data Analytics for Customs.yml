      Value: |
        <image mediaid="" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Customs-Data-Analytics/customs_mainimage.jpg?rev=c81f9886793d42b99acaa638b73b297c&hash=9AB99C4AD2773FB2B939D3160739D1BB" alt="Data Analytics for Customs - header image" />
    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        Even the smallest error in your customs declaration to HMRC can increase the tax you owe, expose your business to penalties, and cast a shadow over your compliance profile.<br /> <br /> KPMG Data Analytics for Customs enables the interrogation of high volumes of your customs and trade data, to support compliance and unlock potential cash opportunities within your business.<br />
        <p>With the significant increase in declarations and the focus on compliance since Brexit, coupled with the introduction of the Customs Declaration Service (CDS), easily accessing and mining your customs and trade data is vital.</p> <p>Our Customs data analytics platform helps you to identify trends within your supply chain, potential duty savings and business process gaps.   </p> <p> </p> <img alt="Speak to our experts - book a demo" style="height:400px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Customs-Data-Analytics/Customs-data-analytics---banner-(2).png?rev=59402d68e8a941af931fa2f711efdcc5&hash=6D6D6F635F5FBB6FCBC1BAF2BBBC0FC7" />  <h2>Compliance support </h2> <p>Check 100% of import and export entries against a standard repository of common risk parameters included with the tool. Our technology will conduct over 30 opportunity and exception checks based on 100+ years of customs and IT experience. </p> <h2>Customised for your business </h2> <p>You&rsquo;ll have the option to tailor risk parameters to your business&rsquo; customs profile, and new checks and visuals can be added as needed. </p> <p>Our standard model is based on HMRC Management Support System (MSS) data and Customs Declaration Service data (CDS). </p> <h2>Process efficiency </h2> <p>Increase the efficiency of post-declaration entry reviews with automated data analysis. You&rsquo;ll be able to quickly access the insights you need with interactive summary dashboards and key metrics held together in one portal.  </p> <p>Once up and running, new data can be added to refresh your dashboards on a regular basis. </p> <h2>Save valuable time and resource  </h2> <p>Free up your employees to focus on investigating the potential exceptions and opportunities identified. </p> <h2>Easily accessible </h2> <p>Our solution is web-based, housed on a secure platform for client collaboration. </p> <p>It uses multi-factor authentication for security and each user will be given their own login.  </p> <p><img alt="Are you overpaying duties? Are you prepared for your next customs audit? Are your processes optimal and fit for purpose? " style="height:250px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Customs-Data-Analytics/Customs-Data-Analytics---GIF.gif?rev=3bea222874d14c1fa6c58d54e6d5a0e4&hash=E7BB2597A253F26699C3DD94D6726889" /></p> <p><em><sub><sup>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities</sup></sub></em></p> <div> </div>
