    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000001"
      Hint: BannerImage
      Value: |
        <image mediaid="" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/P11D/P11D-main-image.jpg?rev=4f0f9d0236aa4f65af4f55ba51d941ac&hash=C4CA71E8DC7308DD2E2D824E4AB8CB95" alt="P11D Main image" />
    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        Our HMRC recognised software has been helping clients for over 12 years to automate the reporting of employee benefits to HMRC, calculate liability for HMRC, and produce Forms P11D for distribution to employees.<br />
        <p>P11D reporting is a challenging and resource intensive process that has significant risk in terms of fines, reputation, and employee tax implications.  </p> <p>Whether you&rsquo;re looking to automate your P11D reporting, or you want to outsource the entire process, our employment services team of tax experts and technologists can help. </p> <p>We offer two types of P11D services, Licensing and Outsourcing, with prices starting from &pound;1,500 per 150 Forms.</p> <p> </p> <p><img alt="Get in touch banner" style="height:550px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/001_February2024/P11D---banner.png?h=550&w=1920&rev=b8da3307e4804ca986fe65606cc3ffb5&hash=77BC60A9FF15DE7CB308FC6E82189078" /></p> <h2>Streamline your governance & compliance</h2> <p>As a recognised HMRC supplier, our software enables direct filing to HMRC with instant feedback, as well as the ability to test and validate your data, before making a live submission. </p> <p>Updated with the latest tax legislation ahead of each reporting period, our software holds complex benefit computations, saves time and reduces the need for in-depth knowledge across your team. </p> <p>In line with the recent HMRC mandates to submit P11D and P11D(b) returns online, our tool streamlines your process as well as providing your submission status.</p> <h2>Create a positive employee experience</h2> <p>With our technology, quickly send customised emails to employees with their Forms P11D attached. You&rsquo;ll have the option to:  </p> <ul> <li>Password protect Forms with individual NI (default) or staff numbers (if NI is missing).</li> <li>Produce customisable cover letters, ideal for leavers where you need to send them by post.</li> <li>Reduce the number of P11D related HR queries by attaching an appendix of detailed explanations on the reported benefits.</li> <li>Submit unlimited quarterly Form P46(car) changes, ensuring your employee tax codes are as accurate as possible throughout the year.</li> </ul> <h2>Reduce manual errors </h2> <p>Mitigate the risk of human error and associated penalties with our built-in calculations and data validation tools. It also enables comprehensive reporting options such as Class 1A summary and reconciliation reports. </p> <h2>Save time and resource </h2> <p>Bulk import data via Excel and roll forward employee and benefit information to the following tax year to save valuable time and resource.  </p> <h2>Receive dedicated support from our experts </h2> <p>You&rsquo;ll have the option to join a bespoke Teams training session, and we&rsquo;ll provide a comprehensive step-by-step user guide to support you throughout the P11D process. </p> <p>You&rsquo;ll also have access to a dedicated mailbox and helpline for additional ongoing support.  </p> <h2>Service and pricing </h2> <p>We offer two types of P11D services, Licensing and Outsourcing. Pricing varies depending on the type of service you choose:  </p> <p><strong>P11D Licensing</strong> </p> <p>This includes the provision of KPMG&rsquo;s P11D Solutions software. </p> <p>Fees are typically determined by the number of Forms P11D you are intending to prepare. Our licenses are provided in tiers starting at 150 Forms for &pound;1,500 + VAT. Pricing works on an economies of scale basis, therefore the larger the license the cheaper per unit price. </p> <p><strong>P11D Outsourcing</strong> </p> <p>The outsourcing service is a comprehensive service which supports you throughout the entire Form P11D completion process, from data preparation to submission to HMRC.  </p> <p>Our HMRC compliant software will analyse and calculate your employee benefits data to ensure the computation is correct. If support is required for complex expense and benefit legislation, our experienced tax experts can help mitigate risk and fines. </p> <p>The fee is typically the license fee plus any support needed in preparing the P11Ds. We can provide a quote and scope of work upon request. Fees typically depend on the below factors:  </p> <ul> <li>Number of PAYE references</li> <li>Number of Forms P11D to be prepared </li> <li>Types of benefits provided (for example - company cars, private medical)</li> <li>The level of tax support required from our experts </li> </ul> <p><em><sub><sup>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities</sup></sub></em></p>
