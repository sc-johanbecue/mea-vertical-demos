    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        <p>As an employer, it's your responsibility to check that each employee has the right to work in the UK. Our intuitive app makes the process quick and easy.</p>
        <p>Since October 2022, all businesses are legally required to conduct either in-person or digital 'right to work' checks, to ensure that every employee is eligible to work in the UK. Non-compliance could result in fines of up to £20,000 per individual, criminal charges, and reputational damage. Streamline and speed up the process with our Right to Work app. </p> <h2>An end-to-end solution</h2> <p>Documents can be digitally verified by uploading them into the app. Each check is securely stored on a web portal and users will be alerted to expiring documents and re-checks. </p> <h2>Quick and accessible</h2> <p>Each check typically takes less than a minute and our mobile app guides users through every step. Using our app, you'll automate and standardise the 'right to work' process, saving valuable time and effort for your HR team. </p> <h2>Compliance at your fingertips</h2> <p>KPMG’s UK immigration lawyers keep the logic of the app up to date, working to ensure that it reflects current immigration law. </p> <h2>Privacy safeguarding</h2> <p>With personal information at stake, our technology is designed in line with GDPR requirements and high-level digital safety. </p> <img alt="50% - the increase in the number of Home Office audits since 2022; £60,000 - the amount you could be fined by the Home Office for non-compliance; 1 minute – our app typically takes less than this per check and does not require an immigration expert. " style="height:600px; width:1920px;" src="https://cd-prod-horizon.azureedge.net/-/media/Solution-pages/Right-to-Work/Right-to-Work---stats60.gif?rev=3e2bba48f7f742fd94a9f6ee4553a4c6&hash=DEDF4A081622EFD63343D3AC783CB031" /> <h2>Did you know?</h2> <ul> <li>There was a 50% increase in the number of Home Office audits of businesses between 2021 and 2022.</li> <li>Non-compliance could result in fines of up to £60K per employee you hire without the appropriate Right to Work checks.</li> <li>Each check with our app should take no more than a minute to complete, giving you an efficient and cost-effective way to ensure compliance. </li> </ul> <h2>Pricing and how to buy</h2> <p>Pricing will vary depending on your choice - choose from an enterprise version of the product or a bespoke set up. <br /> <br /> <strong>Enterprise: </strong></p> A KPMG branded portal and app. Flat implementation fee. Quarterly licence fee. (The licence fee is based on the number of checks completed per quarter.) <strong>Bespoke: <br /> </strong> Own-branded portal and app. Integrated into your internal HR systems, allowing for features such as Single Sign-On. Bespoke pricing options, based on your individual needs. <em><sup><sub>Some or all of the services described herein may not be permissible for KPMG audited entities and their affiliates or related entities. KPMG Law is part of KPMG LLP, a multi-disciplinary practice authorised and regulated by the Solicitors Regulation Authority. SRA ID: 615423. For full details of our professional regulation please refer to 'Regulatory information' under 'About' at kpmg.com/uk</sub></sup></em>
