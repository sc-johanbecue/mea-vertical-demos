        <div class="ck-content"><h3>Community Guidelines</h3><p>Welcome to KPMG Beyond, where leaders belong. To ensure a welcoming and valuable space, follow these guidelines:</p><ul><li>Engage respectfully in discussions and networking.</li><li>Share expertise generously while valuing diverse views.</li><li>Stay professional and avoid offensive language.</li><li>Focus on connection and growth, not promotions.</li><li>Protect confidentiality and avoid sharing sensitive information.</li><li>Base claims on credible information.</li><li>Respect privacy and avoid soliciting personal or financial data.</li></ul><p>Let’s build a supportive community of leaders dedicated to learning and growth. Thank you for being part of KPMG Beyond.</p></div>
