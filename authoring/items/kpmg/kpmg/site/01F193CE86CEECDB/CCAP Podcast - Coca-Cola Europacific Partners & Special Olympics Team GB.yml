      Hint: Summary
      Value: "Tom Casson, Head of Projects at Special Olympics Great Britain and Holly Firmin, Senior Community Partnerships Director at Coca-Cola Europacific Partners, join the CCAP podcast to explore the work they do together to empower and equip Special Olympians with the entrepreneurial skills they need to suceed in their business endeavours and they're joined by a Special Olympian - Marcus Mason-Williams - who shares his own journey through the Unified Business programme, producing his own children's books and his ambitions of becoming a leading animator to rival Walt Disney."
