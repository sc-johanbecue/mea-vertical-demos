    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000003"
      Hint: Body
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><em style="box-sizing:inherit;"><em>Depending on your professional institute’s requirements, reading this article may qualify as CPD. Please consult your institute’s guidance on verifiable and non-verifiable CPD activities for more information.</em></em></p><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">If someone asked you what your definition of leadership is, what would you say?&nbsp;<br /><br />For some, the answer is support, for others it's achieving results or inspiring people to grow. There isn’t a clear-cut textbook guide on what makes a great leader successful every single time. After all, nobody is perfect.&nbsp;&nbsp;<br /><br />But there are several steps you can take to ensure you’re leading your team in the right direction:&nbsp;</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:inherit;">1. Vision&nbsp;</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Have a vision and share it with your team; inspire and motivate them to work towards a common and ambitious goal. Creating a shared vision can prove difficult and may take some time, so ensure that you think long term - where do you see your business in 5, 10, or 15 years?&nbsp;</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Ikea is a great example of a vision-led company, with their goal "to create a better everyday life for the majority of people.”&nbsp;</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong>2.&nbsp;</strong><strong style="box-sizing:inherit;">Motivation&nbsp;</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Motivation is often considered a trait of great leaders. It's key to channelling your team's energy and their potential to achieve goals.&nbsp; &nbsp;</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Setting goals for your employees can also help to encourage self-motivation. If they’re able to measure their progress and review their goals, they'll be empowered by a sense of ownership over their own success. Not only that, this also increases transparency within a team, a key enabler of motivation.&nbsp;&nbsp;</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong>3.&nbsp;</strong><strong style="box-sizing:inherit;">Servicing your team&nbsp;</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">As a leader, you're there to support your team and employees, not the other way around. Be supportive of your team, ensure they have the right tools to do their job, listen to their opinions, recognise their achievements and pay attention to the little things. Has an individual's attitude changed slightly? Why might that be? What's the overall temperature of your team meetings? Check in with your workers regularly and mentor your team to effectively support their professional growth and aspirations.&nbsp;&nbsp;</p><figure class="image"><img style="aspect-ratio:1920/200;box-sizing:inherit;display:block;margin:10px auto !important;max-width:100%;pointer-events:none;" src="https://cd-prod-horizon.azureedge.net/-/media/,-w-,June-July_2024/Simon-Sinek.png?h=200&amp;w=1920&amp;rev=53a02ab346454544b288302dc085bfe4&amp;hash=C9D5D4BCC65CD3D89C7FEB2DB51A909F" alt="&quot;Leadership is not about being in charge. Leadership is about taking care of those in your charge.” — Simon Sinek" width="1920" height="200" /></figure><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:inherit;">4. Empathy</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Emotional intelligence is one of the most important attributes you can develop as a leader. It enables leaders to put themselves in an individual’s shoes and better understand their concerns as well as potential solutions.&nbsp;</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Empathy supports both client and employee engagement; it can foster a safe and trusted environment whilst also allowing you to establish links and build relationships, ultimately contributing to business success. Be the manager you needed when you were starting your career.&nbsp;</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:inherit;">5. Creativity&nbsp;&nbsp;</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Inspiring and encouraging creativity within your team, either by sharing ideas for the latest project, new ways of working or the company vision. This could encourage individuals to improve their skills, feel valued in their contributions and opinions, and build trust amongst your workforce.&nbsp;&nbsp;</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong>6.&nbsp;</strong><strong style="box-sizing:inherit;">Set the bar&nbsp;</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">A good leader sets the bar. ‘Do as I say, not do as I do’ has no place in good leadership. Great managers want their teams to realise their professional goals and to bring out the best of them. Get to know your employees and what their needs are, and provide the time necessary to support them. Treat employees as you’d like to be treated in their situation and set expectations by leading with your best foot forward.&nbsp;&nbsp;</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong>7. Strategic m</strong><strong style="box-sizing:inherit;">anagement&nbsp;</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">As a leader, you must guide your team towards the end goal, but always know when to step back. Let your team take the initiative where appropriate, this will encourage both personal and professional development.&nbsp;</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Management focusses on the goal. Leadership focusses on the people.&nbsp;&nbsp;</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong>8.&nbsp;</strong><strong style="box-sizing:inherit;">Team building</strong></h2><p><span style="background-color:rgb(7,2,33);color:rgb(255,255,255);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">&nbsp;</span></span></p><figure class="image"><img style="-webkit-text-stroke-width:0px;aspect-ratio:1920/200;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);display:block;font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:10px auto !important;max-width:100%;orphans:2;pointer-events:none;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" src="https://cd-prod-horizon.azureedge.net/-/media/,-w-,June-July_2024/Steve-Jobs.png?rev=5082a0b08e9642aeaa10ec50b396dcc7&amp;hash=3BE1194D923B40DAA995A862390A5B8E" alt="&quot;Great things in business are never done by one person, they're done by a team of people.” — Steve Jobs" width="1920" height="200" /></figure><p><span style="background-color:rgb(7,2,33);color:rgb(255,255,255);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">To be an effective leader you need an effective team. Having a team you can rely on, full of individuals that work well together and support each other can be the difference between reaching your goal and not. Encourage open dialogues, build support and trust, and most importantly, get to know your team both professionally and, on an appropriate level, personally. Remember that your business goals will not be achieved on your own.</span></span></p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong><span style="box-sizing:inherit;font-size:13px;line-height:1.8;"></span>9. </strong><strong style="box-sizing:inherit;">Own your mistakes&nbsp;</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Leaders are responsible for decision making and more often than not, risk-taking. Have the courage to own any mistakes or missteps you make, no matter how large or small. Take ownership in rectifying them without passing blame. This builds a culture of trust and transparency.&nbsp;&nbsp;</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:inherit;">10. Continuous improvement&nbsp;</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Where possible, strive for better. Ask yourself: how can I improve? How can I improve my team or an individual? How can I improve my processes?</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Continuous improvement can separate the good leaders from the great.&nbsp;</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(7, 2, 33);box-sizing:inherit;color:rgb(255, 255, 255);font-family:&quot;Open Sans&quot;;font-size:20px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Leadership is not hierarchical, or about your position in a company. Leadership is a skill, an attitude, a characteristic. It’s enthusiasm for your job, the goals that you set out to achieve and experiencing the joy of ultimately sharing these with others.</p></div>
    - ID: "b1a2c3d4-e5f6-7890-abcd-ef1000000006"
