      Hint: Description
      Value: |
        <div class="ck-content"><div><div><div><div><p>If you’re looking for new homes in the East Midlands, Miller Homes is almost certain to have something to suit you.</p><p>Whether you’re drawn to the urban buzz or the spectacular scenery of the Peak District, there’s something for everyone in the East Midlands. Choose from thriving cities including <a href="https://www.millerhomes.co.uk/locations/east-midlands-and-the-surrounding-areas/nottingham.aspx">Nottingham</a>, <a href="https://www.millerhomes.co.uk/locations/east-midlands-and-the-surrounding-areas/leicester.aspx">Leicester</a>, <a href="https://www.millerhomes.co.uk/locations/east-midlands-and-the-surrounding-areas/derby.aspx">Derby</a> and more. Or, if you prefer a more relaxed pace of life, we have developments located in a number of picturesque towns and villages too.</p><p>Here at Miller Homes, we pride ourselves on ensuring that our East Midlands properties are of the highest quality, so you’re sure to find a home that appeals to you and your family.</p><p>A number of major road arteries pass through the East Midlands, including the M1 – which links the area to London and <a href="https://www.millerhomes.co.uk/locations/yorkshire-and-the-surrounding-areas/leeds.aspx">Leeds</a> – and the A46, connecting the region to southern England. East Midlands Airport, located in Leicestershire offers domestic and overseas flights.</p><p>To find out more about Miller Homes’ new homes in the East Midlands, please get in touch.</p></div></div><p>&nbsp;</p></div></div></div>
