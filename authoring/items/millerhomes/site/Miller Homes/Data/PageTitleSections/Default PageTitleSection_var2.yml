      Value: |
        <div class="ck-content"><div class="space-y-md"><p><strong>About us</strong><br /><span>For more than 90 years, we've been building homes for people to make their own. To stamp their personality on, to grow in, thrive and build communities. Throughout that time we've been listening to our customers, understanding what they like and what they want, and using that knowledge to continually improve and enhance the homes we build. From the materials we use and the craftsmanship we insist on, to our meticulous quality control and the exceptional customer service we pride ourselves on, we always go the extra mile. That’s who we are.</span><br /><br /><strong>About our homes</strong><br /><span>Behind the obvious kerb appeal, every home we build is designed and constructed to the highest professional standards. Beautifully proportioned rooms, impeccably finished and decorated. Our commitment to skilled, professional workmanship has remained constant over the decades. But much has changed. Energy efficiency, which can almost halve heating bills, is now a major consideration and we are committed to ensuring the highest possible levels for the benefit of both our homeowners and the environment. We have always chosen the best locations, to bring a peaceful ambience to urban settings and maximise convenience in rural developments. And, more than ever, we are acutely aware of our responsibilities to nature and sustainability.</span><br /><br /><strong>About our standards</strong><br /><span>We have a five star rating for customer satisfaction – the best possible – from the Home Builders Federation. The comprehensive checking process our site managers undertake before any home is handed over to its new owner is reflected in the many quality awards they have won. Our site staff are actively rewarded for safe and careful practice. And our customer service people all know that their main task is to make your life easier and less stressful. We invite an independent research company to find out how our homebuyers, after they’ve moved in, assess their whole experience. In 2024, they found that 95% of our customers would recommend us. For us, that’s the measure that really matters.</span><br />&nbsp;</p><ul><li>East Midlands</li><li>North East</li><li>North West</li><li>Scotland</li><li>Yorkshire</li><li>South East</li><li>South West</li><li>West Midlands</li><li>Wales</li></ul><p>&nbsp;<span>That’s enough about us. Would you like to tell us a little about yourself?</span></p></div></div>
