        <div class="ck-content"><h3>From moving boxes to making memories</h3><p>Adventure awaits in your brand-new home! At Miller Homes, we&#8217;re here to turn your &#8216;one day&#8217; dreams into &#8216;right now&#8217; reality. On selected homes you can choose from up to 5% towards your mortgage, deposit, or Stamp Duty*, or benefit from our Part Exchange&#8224; and Assisted Move^ options, meaning your new adventure is closer than you think. So, get moving. Pre-reserve your new home online today. <a href="https://www.millerhomes.co.uk/promo/adventure-awaits">Terms and conditions apply</a>.</p><p><br />&#160;</p><h3>Find out more</h3><p>Visit us anytime during our opening hours and find out how we could help you move here; no appointment is needed. If you would prefer to, you can still make an appointment by calling our sales centre or booking on our website. We look forward to seeing you soon.</p><h3>Show homes and virtual show homes</h3><p>Our stunning 4-bedroom Gresham show home and 4-bedroom Ridgewell view home are now open in Northampton. You can also take a virtual tour of some of our other homes by looking through the gallery in the 'Explore' section further down the page.</p><h3>The perfect place to call home</h3><p>Come visit us to learn more about our current available homes, featuring detached 4 bedroom homes with garage, 3 bedroom detached homes, 3 bedroom 3 storey semi-detached homes, 2 bedroom terraced and semi-detached homes.</p><p>Miller Homes @ Norwood Quarter is an exciting new development of energy efficient 2, 3, 4 and 5 bedroom homes and apartments set within easy walking distance of the desirable Duston area of Northampton, near beautiful open countryside yet just a five minute drive to Junction 16 of the M1 offering easy links to London and Birmingham, this is the perfect place to call home. Northampton town centre is a short drive away, alongside well-rated schools, shops and amenities making this an ideal base for commuting and family living. Norwood Quarter offers the charm of a well-connected community with everyday essentials right at your doorstep. </p><h3>Energy-efficient family homes</h3><p>A report published by the Home Builders Federation in February 2025, found that&#8230;<br />New build home buyers could save an average of almost &#163;979 a year on their energy bills<br />86% of new build homes are rated A or B for energy efficiency<br />New build homes are likely to be 50% cheaper to run than their older equivalents<br />Not only are our homes here at Norwood Quarter extremely cost-efficient, energy-efficient and environmentally friendly, they also combine style and comfort, with a dedicated study or flexible living and bedroom space that can comfortably accommodate home working, and private gardens which allow you to make the most of the outdoors.</p></div>
