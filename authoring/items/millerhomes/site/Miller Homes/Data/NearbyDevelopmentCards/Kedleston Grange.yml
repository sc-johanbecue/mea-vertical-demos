        <p>Situated on the edge of the sought-after suburb of Allestree with countryside stretching to the west and within the catchment for the \"outstanding\" Ofsted rated Ecclesbourne School, Kedleston Grange offers an exciting selection of energy efficient two to five bedroom homes in a beautifully landscaped setting. Within walking distance of local amenities and eateries including the Park Farm Shopping Centre, The Joiners Arms, The Markeaton and the Co-op as well as providing excellent transport links to the A38, A50 and M1, Kedleston Grange is the perfect place to call home.</p>
