      Value: <p>The Woods is part of the new City Fields neighbourhood, which is a sensitively planned, sustainable and enormously attractive addition to the community of Wakefield. Conceived to integrate a diversity of open natural areas with new social, educational and leisure amenities and outstanding residential opportunities, including this newly available selection of energy efficient three, four and five bedroom homes at The Woods, it combines a welcoming sense of place with excellent transport links that include extensive cycleways and footpaths</p>
