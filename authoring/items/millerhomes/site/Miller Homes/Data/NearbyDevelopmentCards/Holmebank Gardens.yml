      Value: "<p>In beautiful Yorkshire countryside, amidst the magnificent Pennine Hills, the picturesque village of Honley is a welcoming, traditional community where excellent independent local shops and services are complemented by good transport connections. This attractive tree-lined development at Holmebank Gardens brings an exciting selection of energy efficient two, three, four and five bedroom homes into a peaceful setting just two minutes' drive from the A616 and a pleasant fifteen minute stroll from the village centre.</p>"
