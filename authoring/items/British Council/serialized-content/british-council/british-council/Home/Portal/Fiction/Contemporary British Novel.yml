      Hint: Synopsis
      Value: Ontdek de hedendaagse Britse roman in de digitale bibliotheek van de British Council. Deze fictietitel brengt boeiend materiaal samen voor zowel leerlingen als nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "Hedendaagse Britse roman begint met een zorgvuldig opgebouwd begin dat je in zijn wereld trekt. De openingshoofdstukken introduceren personages, plaats en doel met helderheid. Naarmate het verhaal zich ontvouwt, verweven thema's van cultuur, leren en nieuwsgierigheid zich door alledaagse details. Observaties worden licht gebracht, maar verdiepen zich daarna. Halverwege krijgt de toon een zelfverzekerd ritme. Scènes worden met spaarzaamheid geschetst, waardoor de lezer de ruimte krijgt om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, draden worden samengebracht, en de slotregels van deze preview nodigen je uit om verder te lezen dan de eerste twintig pagina's."
