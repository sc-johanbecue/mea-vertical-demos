      Hint: Synopsis
      Value: Ontdek Reisgesprekken van de British Council Digitale Bibliotheek. Deze audioboektitel biedt boeiend materiaal voor zowel leerlingen als nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "Reisgesprekken begint met een zorgvuldig opgebouwd introductie die je in zijn wereld trekt. De openingshoofdstukken stellen personages, plaats en doel duidelijk vast. Naarmate het verhaal zich ontvouwt, verweven thema's zoals cultuur, leren en nieuwsgierigheid zich door alledaagse details. Observaties landen lichtjes en verdiepen vervolgens. Tegen het midden van dit voorbeeld krijgt de toon een zelfverzekerd ritme. Scènes worden met zuinigheid geschetst, waardoor er ruimte is voor de lezer om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, draden worden verzameld, en de slotregels van deze preview nodigen je uit om verder te gaan dan de eerste twintig pagina's."
