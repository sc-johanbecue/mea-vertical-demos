      Hint: Synopsis
      Value: Ontdek Nieuws in Traag Engels van de British Council Digitale Bibliotheek. Deze Audioboektitel brengt boeiend materiaal samen voor zowel leerlingen als nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "Nieuws in Traag Engels begint met een zorgvuldig getimed introductie die je in zijn wereld trekt. De openingshoofdstukken vestigen personages, plaats en doel met helderheid. Naarmate het verhaal zich ontvouwt, verweven thema's van cultuur, leren en nieuwsgierigheid zich door alledaagse details. Observaties landen licht, en verdiepen zich dan. Tegen het midden van dit voorbeeld neemt de toon een zelfverzekerd ritme aan. Scènes worden met zuinigheid geschetst, waardoor er ruimte is voor de lezer om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, draden worden verzameld, en de slotregels van deze preview nodigen je uit om verder te gaan dan de eerste twintig pagina's."
