    - ID: "b11e2500-0001-4001-8500-000000000018"
      Hint: Synopsis
      Value: Ontdek National Geographic via de British Council Digitale Bibliotheek. Dit tijdschrift biedt boeiend materiaal voor zowel leerlingen als nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "National Geographic begint met een zorgvuldig opgebouwd begin dat je meeneemt in zijn wereld. De openingshoofdstukken introduceren personages, plaats en doel met duidelijkheid. Naarmate het verhaal zich ontvouwt, verweven thema's zoals cultuur, leren en nieuwsgierigheid zich door alledaagse details. Observaties landen licht, maar verdiepen zich vervolgens. Tegen het midden van dit voorbeeld krijgt de toon een zelfverzekerd ritme. Scènes worden met zuinigheid geschetst, waardoor er ruimte is voor de lezer om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, draden worden verzameld, en de slotregels van deze preview nodigen je uit om verder te gaan dan de eerste twintig pagina's."
