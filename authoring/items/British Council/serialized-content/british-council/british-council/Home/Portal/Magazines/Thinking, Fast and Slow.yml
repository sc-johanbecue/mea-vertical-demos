      Hint: Synopsis
      Value: "Découvrez Système 1 / Système 2 : Les deux vitesses de la pensée dans la bibliothèque numérique du British Council. Ce titre de magazine rassemble du contenu captivant pour les apprenants et les lecteurs curieux."
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "Système 1 / Système 2 : Les deux vitesses de la pensée commence par une introduction soigneusement rythmée qui vous plonge dans son univers. Les premiers chapitres établissent les personnages, le lieu et l'objectif avec clarté. Au fil du récit, des thèmes de culture, d'apprentissage et de curiosité se tissent dans les détails du quotidien. Les observations sont légères, puis s'approfondissent. À mi-parcours de cet extrait, le ton s'installe dans un rythme confiant. Les scènes sont esquissées avec économie, laissant au lecteur le temps de s'attarder. Les dernières pages de cet extrait se tournent vers l'avenir : des questions sont soulevées, des fils sont rassemblés, et les dernières lignes de cet aperçu vous invitent à continuer au-delà des vingt premières pages."
