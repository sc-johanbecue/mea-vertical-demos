      Hint: Synopsis
      Value: "Découvrez Manga et au-delà dans la bibliothèque numérique du British Council. Ce titre de bande dessinée rassemble du matériel captivant pour les apprenants et les lecteurs curieux."
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "Manga et au-delà commence par une introduction soigneusement rythmée qui vous plonge dans son univers. Les premiers chapitres établissent clairement les personnages, les lieux et les objectifs. À mesure que le récit se déroule, des thèmes de culture, d'apprentissage et de curiosité se tissent dans les détails du quotidien. Les observations sont légères au début, puis s'approfondissent. Au milieu de cet extrait, le ton s'installe dans un rythme confiant. Les scènes sont esquissées avec économie, laissant au lecteur le temps de s'attarder. Les dernières pages de cet extrait ouvrent des perspectives : des questions sont soulevées, des fils sont rassemblés, et les dernières lignes de cet aperçu vous invitent à aller au-delà des vingt premières pages."
