      Hint: Synopsis
      Value: Ontdek Klassieke Verhalen Audio van de British Council Digitale Bibliotheek. Deze audioboektitel brengt boeiend materiaal samen voor zowel leerlingen als nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "Klassieke Verhalen Audio begint met een zorgvuldig opgebouwd begin dat je in zijn wereld trekt. De openingshoofdstukken introduceren personages, plaats en doel met helderheid. Naarmate het verhaal zich ontvouwt, verweven thema's van cultuur, leren en nieuwsgierigheid zich door alledaagse details. Observaties worden licht gebracht, maar verdiepen zich vervolgens. Halverwege dit fragment krijgt de toon een zelfverzekerd ritme. Scènes worden met beknoptheid geschetst, waardoor er ruimte is voor de lezer om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, draden worden verzameld en de slotregels van deze preview nodigen je uit om verder te gaan dan de eerste twintig pagina's."
