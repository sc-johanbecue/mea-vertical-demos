    - ID: "b11e2500-0001-4001-8500-000000000018"
      Hint: Synopsis
      Value: Ontdek De Observer van de British Council Digitale Bibliotheek. Deze krantentitel brengt boeiend materiaal samen voor leerlingen en nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "De Observer begint met een zorgvuldig opgebouwd introductie die je in zijn wereld trekt. De openingshoofdstukken stellen personages, plaats en doel duidelijk vast. Naarmate het verhaal zich ontvouwt, verweven thema's van cultuur, leren en nieuwsgierigheid zich door alledaagse details. Observaties landen licht, maar verdiepen zich vervolgens. Tegen het midden van dit voorbeeldsettelt de toon zich in een zelfverzekerd ritme. Scènes worden met zuinigheid geschetst, waardoor de lezer de ruimte krijgt om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, draden worden verzameld, en de slotregels van deze preview nodigen je uit om verder te gaan dan de eerste twintig pagina's."
