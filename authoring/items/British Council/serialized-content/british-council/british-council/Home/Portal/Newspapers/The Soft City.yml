      Hint: Synopsis
      Value: Ontdek De Zachte Stad in de British Council Digitale Bibliotheek. Deze krantentitel brengt boeiend materiaal samen voor zowel leerlingen als nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "De Zachte Stad begint met een zorgvuldig opgebouwd begin dat je in zijn wereld trekt. De openingshoofdstukken introduceren personages, plaats en doel met helderheid. Naarmate het verhaal zich ontvouwt, verweven thema's van cultuur, leren en nieuwsgierigheid zich door alledaagse details. Observaties worden licht gebracht en verdiepen vervolgens. Tegen het midden van dit fragment krijgt de toon een zelfverzekerd ritme. Scènes worden met spaarzaamheid geschetst, waardoor de lezer de ruimte krijgt om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, draden worden verzameld, en de slotregels van deze preview nodigen je uit om verder te gaan dan de eerste twintig pagina's."
