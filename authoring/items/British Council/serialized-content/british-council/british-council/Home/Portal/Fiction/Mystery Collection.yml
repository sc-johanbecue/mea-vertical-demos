      Hint: Synopsis
      Value: Découvrez la Collection Mystère de la bibliothèque numérique du British Council. Ce titre de fiction rassemble du contenu captivant pour les apprenants et les lecteurs curieux.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "La Collection Mystère débute par une introduction soigneusement rythmée qui vous plonge dans son univers. Les premiers chapitres établissent avec clarté les personnages, les lieux et les objectifs. Au fil du récit, des thèmes tels que la culture, l'apprentissage et la curiosité se mêlent aux détails du quotidien. Les observations sont légères, puis s'approfondissent. À mi-parcours de cet extrait, le ton s'installe dans un rythme assuré. Les scènes sont esquissées avec économie, laissant au lecteur le temps de s'attarder. Les dernières pages de cet aperçu ouvrent des perspectives : des questions sont soulevées, des fils sont rassemblés, et les dernières lignes de cet extrait vous invitent à poursuivre au-delà des vingt premières pages."
