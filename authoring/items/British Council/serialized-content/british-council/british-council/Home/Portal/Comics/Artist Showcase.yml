    - ID: "b11e2500-0001-4001-8500-000000000018"
      Hint: Synopsis
      Value: Ontdek Kunstenaarsportret van de British Council Digitale Bibliotheek. Deze stripverhaal titel brengt boeiend materiaal samen voor leerlingen en nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "Kunstenaarsportret begint met een zorgvuldig opgebouwd introductie die je meeneemt in zijn wereld. De openingshoofdstukken stellen personages, plaats en doel duidelijk vast. Naarmate het verhaal zich ontvouwt, verweven thema's van cultuur, leren en nieuwsgierigheid zich door alledaagse details. Observaties landen licht, en verdiepen zich vervolgens. Tegen het midden van dit voorbeeld krijgt de toon een zelfverzekerd ritme. Scènes worden met zuinigheid geschetst, waardoor er ruimte is voor de lezer om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, draden worden verzameld, en de slotregels van deze preview nodigen je uit om verder te gaan dan de eerste twintig pagina's."
