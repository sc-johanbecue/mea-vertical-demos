      Hint: Synopsis
      Value: Ontdek The Guardian in de British Council Digitale Bibliotheek. Deze krant biedt boeiend materiaal voor zowel leerlingen als nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "The Guardian begint met een zorgvuldig opgebouwde introductie die je in zijn wereld trekt. De openingshoofdstukken introduceren personages, plaats en doel met helderheid. Naarmate het verhaal zich ontvouwt, verweven thema's van cultuur, leren en nieuwsgierigheid zich met alledaagse details. Observaties worden licht gebracht, maar verdiepen zich daarna. Halverwege dit voorbeeld neemt de toon een zelfverzekerd ritme aan. Scènes worden met economie geschetst, waardoor er ruimte is voor de lezer om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, draden worden samengebracht, en de slotregels van deze preview nodigen je uit om verder te gaan dan de eerste twintig pagina's."
