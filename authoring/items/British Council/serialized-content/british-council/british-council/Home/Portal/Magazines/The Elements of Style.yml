      Hint: Synopsis
      Value: Découvrez Les éléments de style depuis la bibliothèque numérique du British Council. Ce titre de magazine rassemble du contenu captivant pour les apprenants et les lecteurs curieux.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "Les éléments de style commence par une introduction soigneusement rythmée qui vous plonge dans son univers. Les premiers chapitres établissent les personnages, le lieu et l'objectif avec clarté. Au fil du récit, des thèmes de culture, d'apprentissage et de curiosité se tissent dans les détails du quotidien. Les observations atterrissent légèrement, puis s'approfondissent. Vers le milieu de cet extrait, le ton s'installe dans un rythme confiant. Les scènes sont esquissées avec économie, laissant de la place au lecteur pour s'attarder. Les dernières pages de cet extrait se tournent vers l'avenir : des questions sont soulevées, des fils sont rassemblés, et les dernières lignes de cet aperçu vous invitent à aller au-delà des vingt premières pages."
