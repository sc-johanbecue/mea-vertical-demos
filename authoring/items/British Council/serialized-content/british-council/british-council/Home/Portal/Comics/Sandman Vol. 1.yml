      Value: Ontdek Sandman Vol. 1 in de British Council Digitale Bibliotheek. Deze strip biedt boeiend materiaal voor zowel leerlingen als nieuwsgierige lezers.
    - ID: "b11e2500-0001-4001-8500-000000000019"
      Hint: SampleExcerpt
      Value: "Sandman Vol. 1 begint met een zorgvuldig opgebouwd begin dat je in zijn wereld trekt. De openingshoofdstukken introduceren personages, plaats en doel met helderheid. Naarmate het verhaal zich ontvouwt, verweven thema's van cultuur, leren en nieuwsgierigheid zich met alledaagse details. Observaties worden licht gebracht, maar verdiepen zich daarna. Halverwege dit voorbeeld krijgt de toon een zelfverzekerd ritme. Scènes worden met spaarzaamheid geschetst, waardoor er ruimte is voor de lezer om te blijven hangen. De latere voorbeeldpagina's kijken vooruit: vragen worden gesteld, verhaallijnen worden verzameld, en de slotregels van deze preview nodigen je uit om verder te lezen dan de eerste twintig pagina's."
